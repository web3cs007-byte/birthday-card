<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy 20th! May success chase you this decade 😏💰 Macau Style</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .bg-layer {
      position: absolute;
      inset: 0;
      background: url('https://i.pinimg.com/736x/55/80/52/55805262cba85001a8d5d196a647a410.jpg') center/cover no-repeat fixed;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5); /* ပိုမှောင်အောင် ချိန်ထားတယ်၊ လိုအပ်ရင် 0.4 ပြန်ပြောင်းလို့ရတယ် */
      z-index: 2;
    }
    .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      z-index: 10;
      pointer-events: none;
      width: 90%;
      max-width: 1200px;
    }
    .happy {
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: bold;
      margin: 0 0 20px;
      text-shadow: 0 0 40px #ffd700, 0 0 80px #ffaa00, 0 0 120px #ff6600, 5px 5px 15px black;
      animation: glow 4s ease-in-out infinite alternate;
    }
    .name {
      font-size: clamp(3.5rem, 8vw, 6rem);
      color: #ffd700;
      margin: 0 0 15px;
      text-shadow: 0 0 50px #ffcc00, 0 0 100px #ff8800, 0 0 150px #ff5500, 6px 6px 20px black;
      letter-spacing: 4px;
    }
    .age {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      color: #aaffaa;
      margin: 0;
      text-shadow: 0 0 45px #00ff88, 0 0 90px #00cc66, 5px 5px 15px black;
    }
    @keyframes glow {
      from { text-shadow: 0 0 30px #fff, 0 0 60px #ffd700, 0 0 100px #ffaa00; }
      to { text-shadow: 0 0 60px #fff, 0 0 120px #ff8800, 0 0 180px #ff5500; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="text">
    <h1 class="happy">TUN LIN NAING just hit 20 → Game on! 😎</h1>
    <h2 class="name">May your twenties be legendary – stacking wins, crushing goals</h2>
    <p class="age">Level up like a boss! 🖤🚀 🎉✨</p>
  </div>
</div>
</body>
</html>
